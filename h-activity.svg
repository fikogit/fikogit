<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 92" width="1200" height="92" role="img" aria-label="GitHub activity">
<style>.rise{opacity:0;transform:translateY(20px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}@keyframes rise{to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}}</style>
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131E47"/><stop offset="1" stop-color="#0C1330"/></linearGradient>
<linearGradient id="gi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C93FF"/><stop offset="1" stop-color="#5CD6FF"/></linearGradient>
<linearGradient id="holo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#FFB43A"/><stop offset=".25" stop-color="#FF6BD6"/><stop offset=".5" stop-color="#7C93FF"/><stop offset=".75" stop-color="#5CD6FF"/><stop offset="1" stop-color="#FFB43A"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="blur2" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="hs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0"><stop offset="0" stop-color="#F4F6FF"/><stop offset=".42" stop-color="#F4F6FF"/><stop offset=".5" stop-color="#FFB43A"/><stop offset=".58" stop-color="#F4F6FF"/><stop offset="1" stop-color="#F4F6FF"/><animateTransform attributeName="gradientTransform" type="translate" from="-300 0" to="520 0" dur="4.5s" repeatCount="indefinite"/></linearGradient></defs>
<g class="rise" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"><circle cx="32" cy="45" r="7" fill="#FFB43A" filter="url(#glow)"/><circle cx="32" cy="45" r="7" fill="none" stroke="#FFB43A"><animate attributeName="r" values="7;22" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.4s" repeatCount="indefinite"/></circle><text x="58" y="60" font-size="40" font-weight="800" letter-spacing="-1.2" fill="url(#hs)">GitHub activity</text><line x1="434" y1="48" x2="1170" y2="48" stroke="url(#holo)" stroke-width="2" stroke-opacity=".7"/><rect x="1166" y="44" width="8" height="8" fill="#FFB43A" transform="rotate(45 1170 48)"/><circle r="4" fill="#fff" filter="url(#glow)"><animateMotion dur="3.8s" repeatCount="indefinite" path="M434,48 L1170,48"/></circle></g></svg>