<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Fasika Getachew, Enterprise Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1024"/>
      <stop offset="0.6" stop-color="#16214A"/>
      <stop offset="1" stop-color="#2B3C7A"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FA4FF"/>
      <stop offset="1" stop-color="#FFB43A"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <clipPath id="clip"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- drifting glow orbs -->
    <circle cy="70" r="90" fill="#FFB43A" opacity="0.28" filter="url(#blur)">
      <animate attributeName="cx" values="780;920;780" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cy="250" r="80" fill="#8FA4FF" opacity="0.25" filter="url(#blur)">
      <animate attributeName="cx" values="640;560;640" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- network lines with flowing dashes -->
    <g stroke="#8FA4FF" stroke-width="1.4" fill="none" opacity="0.55" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.5s" repeatCount="indefinite"/>
      <path d="M680 70 L780 130 L880 60"/>
      <path d="M780 130 L740 230 L860 220"/>
      <path d="M880 60 L940 150 L860 220"/>
      <path d="M680 70 L740 230"/>
      <path d="M780 130 L940 150"/>
    </g>

    <!-- nodes -->
    <g fill="#FFB43A">
      <circle cx="680" cy="70" r="5"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="130" r="6"><animate attributeName="r" values="5;8;5" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="60" r="5"><animate attributeName="r" values="4;7;4" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="150" r="5"><animate attributeName="r" values="4;7;4" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="230" r="5"><animate attributeName="r" values="4;7;4" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="220" r="5"><animate attributeName="r" values="4;7;4" dur="2.9s" begin="1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="60" y="98" font-size="15" font-weight="600" letter-spacing="6" fill="#FFB43A" opacity="0">
        ENTERPRISE ENGINEER
        <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
      </text>
      <text x="60" y="170" font-size="62" font-weight="700" fill="#EAEEF9" opacity="0">
        Fasika Getachew
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.4s" fill="freeze"/>
      </text>
      <text x="60" y="214" font-size="20" fill="#B8C4F0" opacity="0">
        Solution design  ·  Network &amp; security  ·  Full-stack systems
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.9s" fill="freeze"/>
      </text>
    </g>

    <!-- scanning accent bar -->
    <rect y="246" width="140" height="3" rx="1.5" fill="url(#ac)">
      <animate attributeName="x" values="60;460;60" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="247" width="540" height="1" fill="#8FA4FF" opacity="0.25"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
