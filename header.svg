<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#12264a"/><stop offset="1" stop-color="#0b3a53"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#36bcf7" stop-opacity="0"/><stop offset="0.5" stop-color="#36bcf7"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#36bcf7" stop-opacity=".45"/><stop offset="1" stop-color="#36bcf7" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#7c5cff" stop-opacity=".40"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
<clipPath id="r"><rect width="1000" height="260" rx="18"/></clipPath>
</defs>
<style>
.n{animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
.s{animation:rise 1.2s .35s cubic-bezier(.2,.8,.2,1) both}
.t{animation:rise 1.2s .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sweep{animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-700px)}100%{transform:translateX(700px)}}
</style>
<g clip-path="url(#r)">
<rect width="1000" height="260" fill="url(#bg)"/>
<circle r="190" fill="url(#b1)"><animate attributeName="cx" values="150;420;150" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="60;190;60" dur="11s" repeatCount="indefinite"/></circle>
<circle r="210" fill="url(#b2)"><animate attributeName="cx" values="880;600;880" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="210;50;210" dur="12s" repeatCount="indefinite"/></circle>
<g stroke="#ffffff" stroke-opacity=".05"><path d="M0 0V260"/><path d="M50 0V260"/><path d="M100 0V260"/><path d="M150 0V260"/><path d="M200 0V260"/><path d="M250 0V260"/><path d="M300 0V260"/><path d="M350 0V260"/><path d="M400 0V260"/><path d="M450 0V260"/><path d="M500 0V260"/><path d="M550 0V260"/><path d="M600 0V260"/><path d="M650 0V260"/><path d="M700 0V260"/><path d="M750 0V260"/><path d="M800 0V260"/><path d="M850 0V260"/><path d="M900 0V260"/><path d="M950 0V260"/><path d="M1000 0V260"/><path d="M0 0H1000"/><path d="M0 50H1000"/><path d="M0 100H1000"/><path d="M0 150H1000"/><path d="M0 200H1000"/><path d="M0 250H1000"/></g>
<text class="n" x="60" y="118" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="1">Fasika Getachew</text>
<text class="s" x="62" y="160" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#9fd8ff" letter-spacing="3">ENTERPRISE ENGINEER  /  SOLUTION DESIGN</text>
<text class="t" x="62" y="196" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#8fa3c4">hands-on technical implementation, on the side</text>
<rect x="60" y="214" width="880" height="2" fill="url(#ln)" opacity=".8"/>
<rect class="sweep" x="300" y="213" width="120" height="4" rx="2" fill="#ffffff" opacity=".7"/>
</g>
<rect x="1" y="1" width="998" height="258" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
</svg>